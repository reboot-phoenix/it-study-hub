<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Share — IT Study Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#04040a;--surface:#0a0a14;--surface2:#111120;
    --border:rgba(255,255,255,0.07);--border-active:rgba(200,241,53,0.4);
    --lime:#c8f135;--lime-dim:rgba(200,241,53,0.12);--lime-glow:rgba(200,241,53,0.25);
    --text:#eeeef5;--muted:#6b6b80;--muted2:#9494a8;--red:#ff5f56;
    --gold:#f7b731;--gold-dim:rgba(247,183,49,0.12);
    --ff-display:'Syne',sans-serif;--ff-body:'DM Sans',sans-serif;--ff-mono:'JetBrains Mono',monospace;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box; cursor: none !important;}
  body{background:var(--bg);color:var(--text);font-family:var(--ff-body);min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.5;}
  
  /* NAV */
  nav{position:sticky;top:0;z-index:100;padding:0 48px;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(4,4,10,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
  .nav-logo{font-family:var(--ff-display);font-size:15px;font-weight:800;letter-spacing:0.12em;color:var(--text);text-decoration:none;}
  .nav-logo span{color:var(--lime);}
  .nav-back{font-family:var(--ff-mono);font-size:12px;color:var(--muted2);text-decoration:none;display:flex;align-items:center;gap:8px;transition:color 0.2s;}
  .nav-back:hover{color:var(--lime);}

  /* LAYOUT */
  .layout{position:relative;z-index:1;display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 64px);}

  /* SIDEBAR */
  .sidebar{background:var(--surface);border-right:1px solid var(--border);padding:32px 24px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;}
  .sidebar-label{font-family:var(--ff-mono);font-size:10px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;display:block;}
  
  .filter-btn{display:flex;align-items:center;gap:12px;padding:12px;width:100%;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--muted2);cursor:pointer;transition:all 0.2s;margin-bottom:4px;font-family:var(--ff-mono);font-size:13px;}
  .filter-btn:hover{background:var(--surface2);color:var(--text);}
  .filter-btn.active{background:var(--lime-dim);border-color:var(--border-active);color:var(--lime);}

  /* MAIN */
  .main{padding:48px;display:flex;flex-direction:column;gap:40px;}

  /* DROP ZONE */
  .upload-zone{border:2px dashed var(--border);border-radius:20px;padding:40px;text-align:center;transition:all 0.3s;background:rgba(255,255,255,0.02);cursor:pointer;}
  .upload-zone:hover{border-color:var(--lime);background:var(--lime-dim);}
  .uz-title{font-family:var(--ff-display);font-size:18px;font-weight:700;margin-bottom:8px;}
  .uz-sub{font-size:13px;color:var(--muted);font-family:var(--ff-mono);}

  /* FILE GRID */
  .file-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:16px;}
  .file-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;transition:all 0.25s;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;}
  .file-card:hover{border-color:var(--border-active);transform:translateY(-4px);background:var(--surface2);}
  
  .file-icon{width:48px;height:48px;background:var(--surface2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid var(--border);}
  .file-info{flex:1;}
  .file-name{font-weight:600;font-size:14px;display:block;margin-bottom:4px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-meta{font-family:var(--ff-mono);font-size:11px;color:var(--muted);}
  
  .file-tag{position:absolute;top:12px;right:12px;font-family:var(--ff-mono);font-size:9px;padding:2px 8px;border-radius:4px;background:var(--border);color:var(--muted2);}

  .btn-download{padding:10px;background:var(--lime-dim);color:var(--lime);border:1px solid var(--border-active);border-radius:8px;font-family:var(--ff-mono);font-size:11px;font-weight:700;text-align:center;text-decoration:none;transition:all 0.2s;}
  .btn-download:hover{background:var(--lime);color:#000;}

  /* SECTION HEADER */
  .section-label{font-family:var(--ff-mono);font-size:11px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:10px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border);}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp 0.5s ease forwards;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .main{padding:24px;}
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">IT <span>STUDY</span> HUB</a>
  <a href="index.html" class="nav-back">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back Home
  </a>
</nav>

<div class="layout">
  <aside class="sidebar">
    <span class="sidebar-label">Categories</span>
    <button class="filter-btn active" onclick="filterFiles('all', this)">📁 All Files</button>
    <button class="filter-btn" onclick="filterFiles('c', this)">📘 C Programming</button>
    <button class="filter-btn" onclick="filterFiles('java', this)">☕ Java OOPs</button>
    <button class="filter-btn" onclick="filterFiles('python', this)">🐍 Python</button>
    <button class="filter-btn" onclick="filterFiles('csharp', this)">🔷 C# .NET</button>
    
    <div style="margin-top:30px; padding:16px; background:var(--gold-dim); border-radius:12px; border:1px solid rgba(247,183,49,0.2);">
        <span class="sidebar-label" style="color:var(--gold); margin-bottom:4px;">Storage Info</span>
        <div style="font-size:12px; color:var(--muted2); font-family:var(--ff-mono);">Cloud capacity: 2GB</div>
        <div style="width:100%; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin-top:8px;">
            <div style="width:35%; height:100%; background:var(--gold); border-radius:2px;"></div>
        </div>
    </div>
  </aside>

  <main class="main">
    <header class="fade-up">
      <div style="font-family:var(--ff-mono); font-size:11px; color:var(--lime); margin-bottom:8px;">Resource Center</div>
      <h1 style="font-family:var(--ff-display); font-size:48px; font-weight:800;">File <em>Share</em></h1>
    </header>

        <section class="fade-up" style="animation-delay:0.2s;">
      <div class="section-label" id="gridTitle">All Files</div>
      <div class="file-grid" id="fileGrid" style="margin-top:20px;">
        <!-- Files will be injected here by JS -->
      </div>
    </section>
  </main>
</div>

<script>
  const files = [
    { name: "C-Pointers-DeepDive.pdf", size: "2.4 MB", type: "c", icon: "📄" },
    { name: "Java-Inheritance-Map.pdf", size: "1.8 MB", type: "java", icon: "📄" },
    { name: "Python-Data-Science-Cheatsheet.pdf", size: "4.1 MB", type: "python", icon: "📄" },
    { name: "CSharp-Async-Await-Guide.pdf", size: "3.2 MB", type: "csharp", icon: "📄" },
    { name: "C-Memory-Management.zip", size: "12.5 MB", type: "c", icon: "📦" },
    { name: "Java-Spring-Boot-Basics.pdf", size: "5.0 MB", type: "java", icon: "📄" },
    { name: "Advanced-Python-Decorators.pdf", size: "1.1 MB", type: "python", icon: "📄" }
  ];

  function renderFiles(filter = 'all') {
    const grid = document.getElementById('fileGrid');
    grid.innerHTML = '';
    
    const filtered = filter === 'all' ? files : files.filter(f => f.type === filter);
    
    filtered.forEach(file => {
      const card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML = `
        <span class="file-tag">${file.type.toUpperCase()}</span>
        <div class="file-icon">${file.icon}</div>
        <div class="file-info">
          <span class="file-name" title="${file.name}">${file.name}</span>
          <span class="file-meta">${file.size} · PDF Document</span>
        </div>
        <a href="#" class="btn-download">Download</a>
      `;
      grid.appendChild(card);
    });
  }

  function filterFiles(type, btn) {
    // Update active button
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    // Update title
    document.getElementById('gridTitle').innerText = type === 'all' ? 'All Files' : type.toUpperCase() + ' Resources';
    
    renderFiles(type);
  }

  // Initial load
  window.onload = () => renderFiles('all');
</script>
<!-- Custom Cursor -->
<div style="width:10px;height:10px;background:#c8f135;border-radius:50%;position:fixed;pointer-events:none;z-index:9999;mix-blend-mode:difference;transition:transform 0.15s ease;" id="cur"></div>
<div style="width:36px;height:36px;border:1px solid #c8f135;border-radius:50%;position:fixed;pointer-events:none;z-index:9998;opacity:0.5;transition:all 0.2s ease;" id="curR"></div>

<script>
const c = document.getElementById('cur');
const r = document.getElementById('curR');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function anim(){
  c.style.left=(mx-5)+'px'; c.style.top=(my-5)+'px';
  rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
  r.style.left=(rx-18)+'px'; r.style.top=(ry-18)+'px';
  requestAnimationFrame(anim);
})();
document.querySelectorAll('a,button').forEach(el=>{
  el.addEventListener('mouseenter',()=>c.style.transform='scale(2)');
  el.addEventListener('mouseleave',()=>c.style.transform='scale(1)');
});
</script>

</script>
</body>
</html>
