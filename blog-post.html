      <p>Java Streams were introduced in Java 8 and they completely changed how Java developers think about data processing. If you're still writing nested for-loops to filter and transform collections, this article will change your life.</p>
      <h2>What is a Stream?</h2>
      <p>A Stream is not a data structure. It's a pipeline of operations applied to a source of data — a collection, an array, or even an I/O channel. Streams are lazy: nothing executes until you call a terminal operation.</p>
      <p>Think of it like a conveyor belt in a factory. Raw materials (your data) go in one end, and each station on the belt transforms them. At the very end, you collect the finished product.</p>
      <h2>The three parts of every stream</h2>
      <p><strong>1. Source</strong> — where the data comes from. Usually a List, Set, or array.<br>
      <strong>2. Intermediate operations</strong> — transformations that return another stream. Examples: <code>filter()</code>, <code>map()</code>, <code>sorted()</code>.<br>
      <strong>3. Terminal operation</strong> — triggers execution and produces a result. Examples: <code>collect()</code>, <code>forEach()</code>, <code>count()</code>.</p>
      <h2>A real example: filtering students by grade</h2>
      <p>The old verbose way that's hard to read:</p>
      <pre><code>List&lt;Student&gt; topStudents = new ArrayList&lt;&gt;();
for (Student s : students) {
    if (s.getGrade() &gt;= 80) {
        topStudents.add(s);
    }
}
Collections.sort(topStudents,
    Comparator.comparing(Student::getName));</code></pre>
      <p>The Stream way — clean, readable, one expression:</p>
      <pre><code>List&lt;Student&gt; topStudents = students.stream()
    .filter(s -&gt; s.getGrade() &gt;= 80)
    .sorted(Comparator.comparing(Student::getName))
    .collect(Collectors.toList());</code></pre>
      <h2>When NOT to use streams</h2>
      <p>Streams aren't always better. For simple single-element operations, a regular if-statement is more readable. For performance-critical inner loops, streams add overhead. Use them when they make the intent clearer — not just because they're modern.</p>
      <p>The goal of good code is communication. Streams communicate data transformation pipelines better than loops. Master them and your Java code will level up immediately.</p>
    `

      <h2>The three things interviewers actually evaluate</h2>
      <p><strong>1. Can you solve problems?</strong> It's not just about getting the right answer — it's about your approach. Do you jump straight to coding, or do you think out loud, clarify the problem, and consider edge cases first? The process matters as much as the solution.</p>

    excerpt: 'They look intimidating but they are incredibly powerful. We break down Python decorators completely from scratch with real code examples.',

    emoji: '🐍', author: 'IT Study Hub', authorEmoji: '🌟',

    tags: ['Python', 'Decorators', 'Advanced', 'Functions'],
    content: `
      <p>If you've written Flask routes, used Django's <code>@login_required</code>, or seen <code>@staticmethod</code> in a class, you've used decorators. But most students treat them like magic syntax — they know the @ goes above the function, but not why.</p>
      <p>Decorators are one of Python's most powerful features. Once you truly understand them, you'll start seeing opportunities to use them everywhere.</p>
      <h2>First: functions are objects</h2>
      <p>Python functions are first-class objects. You can store them in variables, pass them as arguments, and return them from other functions. This is the foundation decorators are built on.</p>
      <pre><code>def greet():
    return "Hello!"

say_hi = greet   # Storing the function itself
print(say_hi())  # Hello!</code></pre>
      <h2>A decorator is just a function that wraps another function</h2>
      <pre><code>def my_decorator(func):
    def wrapper():
        print("Before the function runs")
        func()
        print("After the function runs")
    return wrapper

@my_decorator
def say_hello():
    print("Hello!")

# @ is sugar for: say_hello = my_decorator(say_hello)</code></pre>
      <h2>A real use case: timing your functions</h2>
      <pre><code>import time

def timer(func):
    def wrapper(*args, **kwargs):
        start = time.time()
        result = func(*args, **kwargs)
        end = time.time()
        print(f"{func.__name__} took {end - start:.4f}s")
        return result
    return wrapper

@timer
def slow_function():
    time.sleep(1)
    return "done"

slow_function()  # slow_function took 1.0012s</code></pre>
      <p>Notice <code>*args</code> and <code>**kwargs</code> — this makes your decorator work with any function signature.</p>
      <h2>The functools.wraps trick</h2>
      <p>When you wrap a function, it loses its name and docstring. Fix this with <code>@functools.wraps(func)</code> inside your wrapper. Always include it in production decorators.</p>
      <p>Decorators are used everywhere in professional Python: for authentication, caching, rate limiting, logging, retrying failed network calls. Master this pattern and a huge chunk of Python libraries will suddenly make sense.</p>
    `

      <p>No concept in programming causes more panic than the C pointer. Students pass their data structures exam without truly understanding pointers, then spend the next two years writing code that occasionally works and occasionally segfaults with no idea why. This article fixes that.</p>
      <h2>What a pointer actually is</h2>
      <p>Your computer's RAM is like a massive array of numbered boxes. Each box holds one byte of data. The number on the box is its <em>address</em>. A pointer is simply a variable that stores one of those addresses — it points to a location in memory rather than storing a value directly.</p>
      <p>When you write <code>int x = 42;</code>, the value 42 is stored at some address, say 1000. When you write <code>int *p = &amp;x;</code>, you're creating a variable <code>p</code> that stores the value 1000 — the address where 42 lives. That's it. A pointer is just an address.</p>
      <h2>The two operators you must understand</h2>
      <p>There are exactly two pointer operators and they do opposite things:</p>
      <p><strong>&amp; (address-of)</strong> — takes a variable and gives you its address. <code>&amp;x</code> gives you the address where x is stored.</p>
      <p><strong>* (dereference)</strong> — takes an address and gives you the value at that address. <code>*p</code> says "go to the address stored in p and give me what's there."</p>
      <pre><code>int x = 42;
int *p = &amp;x;   // p stores the address of x

printf("%d", x);   // prints 42  (the value)
printf("%p", p);   // prints address like 0x7fff... (the address)
printf("%d", *p);  // prints 42  (value AT the address)</code></pre>
      <h2>Why pointers exist at all</h2>
      <p>Two reasons. First, <strong>efficiency</strong>. Passing a large struct to a function copies every byte of it. Passing a pointer copies only 8 bytes (the address) regardless of how big the struct is. Second, <strong>mutation</strong>. In C, function arguments are passed by value — the function gets a copy. If you want a function to modify a variable in the caller, you pass the address of that variable so the function can reach back and change the original.</p>
      <h2>The most common pointer mistake</h2>
      <p>Dereferencing an uninitialized or null pointer is the cause of most segfaults. If you declare <code>int *p;</code> without initializing it, p contains garbage — some random address. Dereferencing it (<code>*p</code>) attempts to read from a random memory location. The OS kills your program. Always initialize pointers, and always check for NULL before dereferencing.</p>
      <pre><code>int *p = NULL;   // safe initialized state

if (p != NULL) {
    *p = 10;     // only dereference if not null
}</code></pre>
      <p>Once this mental model clicks — a pointer is just an address, * means "go there", &amp; means "give me the address" — every pointer concept becomes straightforward: pointer arithmetic, arrays, function pointers, linked lists. They all follow the same rules.</p>
    `

      <p>Most students treat Git as a backup tool — they commit everything to main and push when they're done. That works for solo projects but it's a red flag in every internship and job interview. Professional teams use Git very differently, and learning that workflow will immediately set you apart.</p>
      <h2>The three concepts that actually matter</h2>
      <p><strong>Commits are snapshots, not saves.</strong> Each commit should represent one logical change — a feature, a bug fix, a refactor. The commit message should explain what changed and why, not just "updated code." Bad: <code>git commit -m "stuff"</code>. Good: <code>git commit -m "fix: handle null pointer in user lookup"</code>.</p>
      <p><strong>Branches are free.</strong> Creating a branch costs nothing and takes milliseconds. Every new feature or bug fix should live on its own branch. This keeps main always deployable and lets multiple people work simultaneously without stepping on each other.</p>
      <p><strong>Pull Requests are for review, not just merging.</strong> A PR is how you ask your team to review your code before it goes into the main codebase. Even on a solo project, PRs help you review your own work with fresh eyes.</p>
      <h2>The professional workflow</h2>
      <pre><code># 1. Always start from an up-to-date main
git checkout main
git pull origin main

# 2. Create a branch for your work
git checkout -b feature/add-login-page

# 3. Make commits as you work
git add .
git commit -m "feat: add email/password login form"
git commit -m "feat: wire Firebase signInWithEmailAndPassword"

# 4. Push your branch
git push origin feature/add-login-page

# 5. Open a Pull Request on GitHub
# 6. Get review, make changes, merge</code></pre>
      <h2>Resolving merge conflicts</h2>
      <p>Conflicts happen when two branches modify the same lines of the same file. Git can't decide which version to keep, so it marks the conflict in the file and asks you to resolve it manually. The file will contain markers like <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</code> showing your changes and <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code> showing the incoming changes. Delete the markers, keep the correct code, then commit.</p>
      <p>The best way to minimize conflicts: pull from main frequently, keep branches short-lived (merge within 1-2 days), and communicate with your team about who is touching which files.</p>
      <h2>The .gitignore file</h2>
      <p>Never commit node_modules, .env files, API keys, or build outputs. Create a <code>.gitignore</code> file in your project root listing everything Git should ignore. GitHub has templates for every language — when creating a new repo, select the template for your tech stack.</p>
      <p>One thing that will immediately impress interviewers: commit history that tells a story. Clear branch names, atomic commits, good messages. It shows you understand software development as a collaborative, professional discipline — not just a solo coding exercise.</p>
    `

    excerpt: 'Big-O notation is how engineers measure how code behaves as input grows. Master this and algorithm questions in interviews become much less scary.',
    category: 'tutorial', catLabel: 'Tutorial',
    emoji: '📈', author: 'Dithsa Dutta', authorEmoji: '👨‍💻',

    content: `
      <p>Big-O notation appears in every data structures course and every technical interview, but most students memorize the answers without understanding what they mean. This article builds the intuition from scratch so you can derive complexity on your own instead of looking it up.</p>
      <h2>What Big-O actually measures</h2>
      <p>Big-O describes how the <em>number of operations</em> your code performs grows as the input size n grows. It answers: if I double the input, how much longer does this take? It ignores constants and lower-order terms because at large scale, only the dominant term matters.</p>
      <h2>The common complexities, explained intuitively</h2>
      <p><strong>O(1) — Constant time.</strong> The operation takes the same time regardless of input size. Accessing an array by index, looking up a HashMap key. You do one thing, done.</p>
      <p><strong>O(log n) — Logarithmic.</strong> Every step halves the remaining work. Binary search on a sorted array: you look at the middle, eliminate half, repeat. To search 1 million elements: only 20 steps. This is why sorted data + binary search is so powerful.</p>
      <p><strong>O(n) — Linear.</strong> You touch every element once. A single for-loop over an array. If n doubles, time doubles.</p>
      <p><strong>O(n log n) — Linearithmic.</strong> Most efficient sorting algorithms (Merge Sort, Heap Sort). Slightly worse than linear but vastly better than quadratic.</p>
      <p><strong>O(n²) — Quadratic.</strong> A nested loop where both loops run n times. Bubble sort. Selection sort. Comparing every pair of elements. If n doubles, time quadruples. Fine for n=100, catastrophic for n=100,000.</p>
      <h2>How to analyze your own code</h2>
      <pre><code>// O(n) - one loop
for (int i = 0; i &lt; n; i++) { ... }

// O(n²) - nested loops, both over n
for (int i = 0; i &lt; n; i++) {
    for (int j = 0; j &lt; n; j++) { ... }
}

// O(n) - two separate loops, not nested
for (int i = 0; i &lt; n; i++) { ... }
for (int j = 0; j &lt; n; j++) { ... }
// O(n + n) = O(2n) = O(n) — constants drop out</code></pre>
      <h2>Space complexity</h2>
      <p>Big-O also describes memory usage. An algorithm that creates a new array of size n has O(n) space complexity. One that uses only a few variables regardless of n is O(1) space. Interviewers often ask for both time and space complexity — always mention both.</p>
      <p>The practical takeaway: before submitting any solution, ask yourself "what is the Big-O?" If it's O(n²) and the input can be large, look for a HashMap or sorting-based approach to bring it to O(n) or O(n log n). That mental habit alone will dramatically improve your solutions.</p>
    `

      <p>When we started building IT Study Hub, we had one rule: no templates, no frameworks, no shortcuts. Every line of HTML, CSS, and JavaScript written by hand. Six months later, we have a fully deployed platform with Firebase authentication, a Razorpay payment system, a drag-to-authenticate login, and a global leaderboard. Here's how it actually happened.</p>

      <p>The custom cursor (an interpolated ring that trails behind the mouse using <code>rx += (mx - rx) * 0.12</code>) and the noise texture overlay (an SVG fractal filter rendered as a background) were added last, but they're what people remember first.</p>
      <h2>Firebase: the backend we never had to build</h2>
      <p>The decision to use Firebase meant we could ship a fully functional backend — authentication, database, file storage — without writing a single server. Firebase Auth handles the entire login flow. Firestore stores user profiles, XP, and premium plan status. Firebase Storage hosts the premium PDF materials with auth-gated download URLs.</p>
      <p>The trickiest part was authentication on GitHub Pages. Because our site lives at a subfolder path (esd-project-tiu.github.io/it-study-hub/), we had to switch from <code>signInWithPopup</code> to <code>signInWithRedirect</code> for OAuth providers, and carefully configure authorized domains in both Firebase Console and Google Cloud Console.</p>
      <h2>The drag-to-authenticate login</h2>
      <p>This started as a late-night experiment. The idea: replace the boring submit button with a slider that users drag to authenticate. If credentials are correct — lime particles burst, the panel flashes "ACCESS GRANTED" and redirects. If wrong — the entire login panel glitches (a CSS animation that translates and skews the element rapidly), red particles burst, and it resets after two seconds.</p>
      <p>The implementation is pure JavaScript event handling — <code>mousedown</code>, <code>mousemove</code>, <code>mouseup</code>, and their touch equivalents. The threshold is 88% — drag past that and Firebase auth fires automatically. No button click required.</p>
      <h2>The premium system</h2>
      <p>Razorpay was the obvious choice for India — it supports UPI, all cards, net banking, and wallets with a simple JavaScript SDK. The integration took one afternoon. When payment succeeds, the <code>handler</code> callback fires, we update <code>users/{uid}.plan</code> in Firestore, and the UI unlocks immediately. Three plan tiers: Starter (₹199, 1 course), Pro (₹499, all 6 courses), Elite (₹999, lifetime access + mentor Q&A).</p>
      <h2>What we learned</h2>
      <p>The biggest lesson: start with the design system. Having clear CSS variables (--lime, --surface, --border-active) from day one meant every new page was consistent without any extra thought. The second lesson: Firebase is genuinely excellent for student projects — the free Spark plan covers everything you need to launch and get real users.</p>
      <p>The third lesson, and the most important: ship something real. Not a mockup, not a demo with fake data — a real deployed platform that real students can use. The gap between "looks like a website" and "is a website" is where most student projects never go. We crossed it. You can too.</p>
    `
  }
];

// ── Get post ID from URL ──
const params = new URLSearchParams(window.location.search);
const postId = parseInt(params.get('id'));
const post = POSTS.find(p => p.id === postId);

// ── Render ──
const root = document.getElementById('appRoot');

if (!post) {
  root.innerHTML = `
    <div class="not-found">
      <div class="nf-icon">📭</div>
      <h1 class="nf-title">Article Not Found</h1>
      <p class="nf-sub">This article doesn't exist or may have been moved.</p>
      <a href="blog.html" class="btn-lime">← Back to Blog</a>
    </div>`;
} else {
  // Set page title
  document.title = `${post.title} — IT Study Hub`;

  // Related posts — 2 random others
  const related = POSTS.filter(p => p.id !== post.id).sort(() => Math.random()-0.5).slice(0,2);

  // Extract headings for TOC
  const headings = [...post.content.matchAll(/<h2>(.*?)<\/h2>/g)].map((m,i) => ({
    text: m[1].replace(/<[^>]*>/g,''),
    index: i
  }));

  const tocHTML = headings.length ? headings.map((h,i) => `
    <a class="toc-item" id="toc-${i}" href="#heading-${i}">
      <span class="toc-num">0${i+1}</span>
      <span>${h.text}</span>
    </a>`).join('') : '<p style="font-size:12px;color:var(--muted)">No sections</p>';

  // Number the headings in content
  let hIdx = 0;
  const numberedContent = post.content.replace(/<h2>/g, () => `<h2 id="heading-${hIdx++}">`);

  root.innerHTML = `
  <div class="layout">
    <article class="article-wrap">
      <div class="article-hero">
        <div class="art-category">${post.catLabel}</div>
        <h1 class="art-title">${post.title}</h1>
        <p class="art-excerpt">${post.excerpt}</p>
        <div class="art-meta">
          <div class="meta-author">
            <div class="meta-avatar">${post.authorEmoji}</div>
            <div>
              <div class="meta-name">${post.author}</div>
              <div class="meta-role">${post.authorRole}</div>
            </div>
          </div>
          <div class="meta-divider"></div>
          <div class="meta-item">📅 ${post.date}</div>
          <div class="meta-item">🕒 ${post.readTime} read</div>
        </div>
      </div>

      <div class="art-visual">
        <div class="art-visual-grid"></div>
        <span style="position:relative;z-index:1;filter:drop-shadow(0 0 40px rgba(200,241,53,0.2))">${post.emoji}</span>
      </div>

      <div class="art-body">${numberedContent}</div>

      <div class="art-footer">
        <div class="art-tags">
          ${post.tags.map(t => `<span class="art-tag"># ${t}</span>`).join('')}
        </div>
        <div class="related-title">More Articles</div>
        <div class="related-grid">
          ${related.map(r => `
            <a class="related-card" href="blog-post.html?id=${r.id}">
              <div class="rc-emoji">${r.emoji}</div>
              <div class="rc-cat">${r.catLabel}</div>
              <div class="rc-title">${r.title}</div>
              <div class="rc-meta">${r.readTime} read · ${r.author}</div>
            </a>`).join('')}
        </div>
      </div>
    </article>

    <aside class="sidebar">
      <div class="sidebar-card">
        <span class="sc-label">Reading Progress</span>
        <div class="progress-widget">
          <svg class="prog-circle" viewBox="0 0 72 72">
            <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>
            <circle id="progCircle" cx="36" cy="36" r="30" fill="none" stroke="#c8f135" stroke-width="4"
              stroke-dasharray="188.5" stroke-dashoffset="188.5" stroke-linecap="round"
              transform="rotate(-90 36 36)" style="transition:stroke-dashoffset 0.1s"/>
          </svg>
          <div class="prog-text" id="progPct">0%</div>
          <div class="prog-sub">${post.readTime} read</div>
        </div>
      </div>

      ${headings.length ? `
      <div class="sidebar-card">
        <span class="sc-label">In This Article</span>
        ${tocHTML}
      </div>` : ''}

      <div class="sidebar-card">
        <span class="sc-label">Share</span>
        <button class="share-btn copy-btn" onclick="copyLink()">🔗 Copy Link</button>
        <button class="share-btn" onclick="shareTwitter()">🐦 Share on Twitter</button>
        <button class="share-btn" onclick="shareLinkedIn()">💼 Share on LinkedIn</button>
      </div>

      <div class="sidebar-card" style="background:var(--lime-dim);border-color:var(--border-active);">
        <span class="sc-label" style="color:var(--lime)">Enjoyed this?</span>
        <p style="font-size:13px;color:var(--muted2);line-height:1.6;margin-bottom:14px;">Unlock advanced lessons and all courses with Premium.</p>
        <a href="premium.html" style="display:block;background:var(--lime);color:#000;text-align:center;padding:10px;border-radius:8px;font-family:var(--ff-mono);font-size:11px;font-weight:700;text-decoration:none;letter-spacing:1px;">⚡ GO PREMIUM</a>
      </div>
    </aside>
  </div>`;

  // ── Reading progress ──
  function updateProgress() {
    const winScroll = document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const pct = Math.round((winScroll / height) * 100);
    document.getElementById('readProgress').style.width = pct + '%';
    const el = document.getElementById('progPct');
    const circle = document.getElementById('progCircle');
    if (el) el.textContent = pct + '%';
    if (circle) circle.style.strokeDashoffset = 188.5 - (188.5 * pct / 100);

    // Highlight TOC item
    const headingEls = document.querySelectorAll('[id^="heading-"]');
    let current = 0;
    headingEls.forEach((el, i) => {
      if (el.getBoundingClientRect().top < 120) current = i;
    });
    document.querySelectorAll('.toc-item').forEach((el,i) => {
      el.classList.toggle('active', i === current);
    });
  }
  window.addEventListener('scroll', updateProgress);
}

// ── Share functions ──
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    showToast('🔗', 'Link copied to clipboard!');
  });
}
function shareTwitter() {
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(post?.title || 'Check this out')}&url=${encodeURIComponent(window.location.href)}`;
  window.open(url, '_blank');
}
function shareLinkedIn() {
  const url = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.href)}`;
  window.open(url, '_blank');
}
function showToast(icon, msg) {
  document.getElementById('toastIcon').textContent = icon;
  document.getElementById('toastMsg').textContent = msg;
  const t = document.getElementById('toast');
  t.style.transform='translateY(0)'; t.style.opacity='1';
  setTimeout(() => { t.style.transform='translateY(80px)'; t.style.opacity='0'; }, 3000);
}

// ── Cursor ──
const cur = document.getElementById('cur');
const curR = document.getElementById('curR');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
(function anim() {
  cur.style.left=(mx-5)+'px'; cur.style.top=(my-5)+'px';
  rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
  curR.style.left=(rx-18)+'px'; curR.style.top=(ry-18)+'px';
  requestAnimationFrame(anim);
})();
document.addEventListener('mouseover', e => {
  if (e.target.matches('a,button,.related-card,.toc-item,.art-tag')) cur.style.transform='scale(2)';
  else cur.style.transform='scale(1)';
});
</script>
</body>
</html>
