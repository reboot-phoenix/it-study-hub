      <p>Artificial intelligence has stormed into nearly every layer of the software stack. But there's one domain where most assumed it couldn't reach: low-level systems programming. C, C++, Rust — the languages of operating systems, compilers, and embedded hardware. The land of memory addresses, pointer arithmetic, and undefined behavior.</p>
      <p>That assumption is now being tested.</p>
      <h2>What AI tools can already do</h2>
      <p>Tools like GitHub Copilot, Claude, and GPT-4 can now generate surprisingly functional C and C++ code. Ask them to implement a linked list, write a memory allocator, or explain a segmentation fault — and they often do it well. For students learning systems programming, this is genuinely useful.</p>
      <p>But here's what's more interesting: AI doesn't just write code. It <em>explains</em> code. For a student staring at a pointer error at 2AM, having an AI that can walk through the stack frame step by step is transformative.</p>
      <h2>What AI still gets wrong</h2>
      <p>AI models hallucinate. In systems programming, a hallucination isn't just wrong — it can be a subtle memory bug that compiles cleanly and crashes in production three weeks later. AI-generated C code often looks correct but has off-by-one errors, missing null checks, or incorrect use of volatile.</p>
      <p>The deeper issue: AI doesn't understand <em>why</em> certain patterns exist. It doesn't know that you're writing code for a microcontroller with 2KB of RAM, or that your allocator needs to be lock-free. Context that an experienced systems programmer carries in their head is invisible to the model.</p>
      <h2>What this means for you as a student</h2>
      <p>Learn the fundamentals anyway. Not despite AI, but because of it. The developers who will thrive are those who can tell when AI is wrong — and fix it. That requires real understanding of pointers, memory layout, and hardware behavior.</p>
      <p>Use AI as a tutor, not a replacement. Let it explain concepts, generate examples to experiment with, and help you debug. But write the code yourself first. Struggle with it. The struggle is where the learning happens.</p>
      <p>The C programmers of 2030 won't be slower than today's — they'll be dramatically faster, with AI handling boilerplate while they focus on architecture. But the baseline knowledge required to use these tools well is exactly what courses like ours teach.</p>

      <p>Java Streams were introduced in Java 8 and they completely changed how Java developers think about data processing. If you're still writing nested for-loops to filter and transform collections, this article will change your life.</p>
      <h2>What is a Stream?</h2>
      <p>A Stream is not a data structure. It's a pipeline of operations applied to a source of data — a collection, an array, or even an I/O channel. Streams are lazy: nothing executes until you call a terminal operation.</p>
      <p>Think of it like a conveyor belt in a factory. Raw materials (your data) go in one end, and each station on the belt transforms them. At the very end, you collect the finished product.</p>
      <h2>The three parts of every stream</h2>
      <p><strong>1. Source</strong> — where the data comes from. Usually a List, Set, or array.<br>
      <strong>2. Intermediate operations</strong> — transformations that return another stream. Examples: <code>filter()</code>, <code>map()</code>, <code>sorted()</code>.<br>
      <strong>3. Terminal operation</strong> — triggers execution and produces a result. Examples: <code>collect()</code>, <code>forEach()</code>, <code>count()</code>.</p>
      <h2>A real example: filtering students by grade</h2>
      <p>Old way — verbose and hard to read:</p>
      <pre><code>List&lt;Student&gt; topStudents = new ArrayList&lt;&gt;();
for (Student s : students) {
    if (s.getGrade() >= 80) {
        topStudents.add(s);
    }
}
Collections.sort(topStudents, Comparator.comparing(Student::getName));</code></pre>
      <p>Stream way — clean, readable, one expression:</p>
      <pre><code>List&lt;Student&gt; topStudents = students.stream()
    .filter(s -&gt; s.getGrade() &gt;= 80)
    .sorted(Comparator.comparing(Student::getName))
    .collect(Collectors.toList());</code></pre>
      <h2>When NOT to use streams</h2>
      <p>Streams aren't always better. For simple single-element operations, a regular if-statement is more readable. For performance-critical inner loops, streams add overhead. And if you need to modify external state during iteration, streams can cause confusion. Use them when they make the intent clearer — not just because they're "modern".</p>
      <p>The goal of good code is communication. Streams communicate data transformation pipelines better than loops. Master them and your Java code will level up immediately.</p>

      <p>Your first tech interview is terrifying. You're being evaluated on your thinking process, your communication, your problem-solving, and your code — simultaneously, under time pressure, by a stranger. No wonder most students feel underprepared.</p>
      <p>Here's the thing: preparation is almost entirely the deciding factor. The students who get offers aren't always the most talented — they're the ones who prepared systematically.</p>
      <h2>The three things interviewers actually evaluate</h2>
      <p><strong>1. Can you solve problems?</strong> This is the obvious one. But it's not just about getting the right answer — it's about your approach. Do you jump straight to coding, or do you think out loud, clarify the problem, and consider edge cases first? The process matters as much as the solution.</p>
      <p><strong>2. Can you communicate?</strong> Coding in silence is a red flag. Interviewers want to follow your thinking. Talk through your logic: "I'm thinking about using a HashMap here because lookup will be O(1)..." Even if your solution is wrong, articulating your reasoning shows how you'd work on a team.</p>
      <p><strong>3. Are you someone they want to work with?</strong> Behavioral questions aren't formalities. They're evaluating how you handle conflict, failure, and collaboration. Have 3-4 specific stories from projects or college ready to go.</p>
      <h2>The preparation plan that actually works</h2>
      <p>Don't try to solve 500 LeetCode problems. That's not the game. Instead: solve 50-75 problems across key patterns — two pointers, sliding window, BFS/DFS, dynamic programming basics, and trees. For each problem, understand <em>why</em> the approach works, not just how to implement it.</p>
      <p>Practice explaining your solutions out loud. Record yourself if needed. Most students can solve problems silently but fall apart when asked to explain. Bridge that gap before the interview.</p>
      <h2>The day of the interview</h2>
      <p>Before you write a single line: restate the problem in your own words. Ask about constraints (what's the expected input size? can the array be empty?). Think out loud about 2-3 approaches before picking one. Start with the brute force — never say "I know a better way" without first showing you understand the simple solution.</p>

    content: `
      <p>If you've written Flask routes, used Django's <code>@login_required</code>, or seen <code>@staticmethod</code> in a class, you've used decorators. But most students treat them like magic syntax — they know the @ goes above the function, but not why.</p>
      <p>Decorators are one of Python's most powerful features. Once you truly understand them, you'll start seeing opportunities to use them everywhere.</p>
      <h2>First: functions are objects</h2>
      <p>Python functions are first-class objects. You can store them in variables, pass them as arguments, and return them from other functions. This is the foundation decorators are built on.</p>
      <pre><code>def greet():
    return "Hello!"

say_hi = greet   # Not calling it — storing the function itself
print(say_hi())  # Hello!</code></pre>
      <h2>A decorator is just a function that wraps another function</h2>
      <pre><code>def my_decorator(func):
    def wrapper():
        print("Before the function runs")
        func()
        print("After the function runs")
    return wrapper

def say_hello():
    print("Hello!")

say_hello = my_decorator(say_hello)  # Wrapping manually
say_hello()</code></pre>
      <p>The <code>@</code> syntax is just syntactic sugar for that last assignment line:</p>
      <pre><code>@my_decorator
def say_hello():
    print("Hello!")

# Exactly the same as: say_hello = my_decorator(say_hello)</code></pre>
      <h2>A real use case: timing your functions</h2>
      <pre><code>import time

def timer(func):
    def wrapper(*args, **kwargs):
        start = time.time()
        result = func(*args, **kwargs)
        end = time.time()
        print(f"{func.__name__} took {end - start:.4f}s")
        return result
    return wrapper

@timer
def slow_function():
    time.sleep(1)
    return "done"

slow_function()  # slow_function took 1.0012s</code></pre>
      <p>Notice <code>*args</code> and <code>**kwargs</code> — this makes your decorator work with any function signature, not just functions with no arguments.</p>
      <h2>The functools.wraps trick</h2>
      <p>When you wrap a function, it loses its name and docstring. Fix this with <code>@functools.wraps(func)</code> inside your decorator's wrapper function. It's good practice to always include it in production decorators.</p>
      <p>Decorators are used everywhere in professional Python: for authentication, caching, rate limiting, logging, retrying failed network calls. Master this pattern and a huge chunk of Python libraries will suddenly make sense.</p>
    `

    excerpt: 'Pointers are the single most feared topic in C programming. Here is a clear, visual explanation that will make them click once and for all.',
    category: 'tutorial',

      <p>Ask any C student what scares them most, and the answer is almost always the same: pointers. They're the reason C has a reputation for being "hard". But here's the truth — pointers are just variables that store memory addresses. Once that clicks, everything else follows.</p>
      <h2>Memory is just a giant array</h2>
      <p>Think of your computer's RAM as one enormous array of boxes. Each box holds one byte, and each box has an address — a number that identifies its position. When you declare a variable in C, the compiler reserves some of those boxes and gives that location a name.</p>
      <pre><code>int age = 25;</code></pre>
      <p>The compiler picks, say, address 1004 in memory, stores the value 25 there, and associates the name <code>age</code> with that address. Every time you use <code>age</code>, you're really saying "go to address 1004 and read what's there."</p>
      <h2>A pointer is just a variable that holds an address</h2>
      <pre><code>int age = 25;
int *ptr = &age;   // ptr stores the address of age

printf("%d
", age);   // 25  — the value
printf("%p
", ptr);   // 0x7fff... — the address
printf("%d
", *ptr);  // 25  — dereference: go to that address, read the value</code></pre>
      <p>The <code>&</code> operator gives you the address of a variable. The <code>*</code> operator (when used on a pointer) follows the address and gives you the value stored there. That's it. Two operators, one concept.</p>
      <h2>Why pointers exist</h2>
      <p><strong>1. Efficiency.</strong> Passing a large struct to a function copies the whole thing. Passing a pointer copies just 8 bytes (the address). For arrays and strings, this matters enormously.</p>
      <p><strong>2. Modifying function arguments.</strong> In C, function arguments are passed by value — the function gets a copy. If you want a function to modify the original variable, you pass its address:</p>
      <pre><code>void increment(int *n) {
    (*n)++;   // dereference n, then increment the value at that address
}

int x = 5;
increment(&x);
printf("%d
", x);   // 6</code></pre>
      <p><strong>3. Dynamic memory.</strong> <code>malloc()</code> allocates memory on the heap and returns its address. Without pointers, you couldn't use dynamically allocated memory at all.</p>
      <h2>The most common pointer mistakes</h2>
      <p><strong>Uninitialized pointers</strong> — declaring <code>int *ptr;</code> without initializing it. ptr contains garbage. Dereferencing it is undefined behavior (usually a segfault). Always initialize: <code>int *ptr = NULL;</code></p>
      <p><strong>Dangling pointers</strong> — freeing memory but keeping the pointer. The pointer now points to memory that might be reused for something else. Set it to NULL after freeing.</p>
      <p><strong>Forgetting to dereference</strong> — assigning to <code>ptr</code> instead of <code>*ptr</code> changes what the pointer points to, not the value at that location.</p>
      <h2>Arrays and pointers are deeply connected</h2>
      <p>In C, an array name is essentially a pointer to its first element:</p>
      <pre><code>int arr[3] = {10, 20, 30};
int *ptr = arr;   // ptr points to arr[0]

printf("%d
", ptr[1]);   // 20 — pointer arithmetic
printf("%d
", *(ptr+2)); // 30 — same thing</code></pre>
      <p>This is why you can pass arrays to functions as pointers, and why string manipulation in C feels the way it does.</p>
      <p>Pointers aren't magic. They're the mechanism that connects the abstract world of variable names to the concrete world of memory addresses. Once you internalize that, C becomes dramatically less intimidating.</p>
    `

      <p>Most CS students use Git the same way: <code>git add .</code>, <code>git commit -m "changes"</code>, <code>git push</code>. It works — until you're collaborating with three other people and someone's push breaks everything.</p>
      <p>Git is not just a backup tool. It's a collaboration protocol. Here's the workflow that professional teams actually use — and that interviewers expect you to know.</p>
      <h2>Why the main branch is sacred</h2>
      <p>In production teams, nobody ever commits directly to <code>main</code> (or <code>master</code>). The main branch represents the working, deployable state of the project. Every change — no matter how small — goes through a separate branch and a review process before merging.</p>
      <p>This rule exists because bad code pushed directly to main is immediately in production. Branches create a safety net: you can experiment, break things, and throw away a branch without touching the main codebase.</p>
      <h2>The standard branch workflow</h2>
      <pre><code># Start from an up-to-date main branch
git checkout main
git pull origin main

# Create a feature branch — use a descriptive name
git checkout -b feature/user-login-page

# Make your changes, commit regularly
git add .
git commit -m "Add login form HTML structure"
git commit -m "Wire up Firebase Auth to login form"
git commit -m "Add error handling for invalid credentials"

# Push your branch to GitHub
git push origin feature/user-login-page</code></pre>
      <p>Then on GitHub, you open a Pull Request — a formal request to merge your branch into main. Teammates review it, suggest changes, and approve it before it merges.</p>
      <h2>Writing commit messages that actually help</h2>
      <p>Bad: <code>"fix stuff"</code>, <code>"changes"</code>, <code>"asdf"</code>. These tell you nothing when you're debugging three months later.</p>
      <p>Good commit messages follow this pattern: start with a verb in the present tense describing what the commit does to the codebase. One line, under 72 characters.</p>
      <pre><code>Add null check to user authentication handler
Fix off-by-one error in pagination logic
Remove deprecated API endpoint
Update README with deployment instructions</code></pre>
      <p>Each commit should represent one logical change. If you're writing "and" in your commit message, it should probably be two commits.</p>
      <h2>Handling merge conflicts</h2>
      <p>Merge conflicts happen when two branches changed the same lines of code differently. Git doesn't know which version is correct — so it marks the conflict and asks you to decide:</p>
      <pre><code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
  color: #c8f135;
=======
  color: #ffffff;
&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/redesign</code></pre>
      <p>The section between <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</code> and <code>=======</code> is your version. Below <code>=======</code> is the incoming change. Delete the conflict markers, keep the correct code (or merge both), then commit the resolution.</p>
      <p>The best way to minimize conflicts: pull from main frequently into your branch (<code>git pull origin main</code>), keep branches short-lived, and communicate with teammates about who's working on what files.</p>
      <h2>The git commands you'll use daily</h2>
      <pre><code>git status               # What's changed?
git diff                 # What exactly changed?
git log --oneline        # History at a glance
git stash                # Save uncommitted work temporarily
git stash pop            # Restore stashed work
git reset --soft HEAD~1  # Undo last commit, keep changes staged
git blame filename       # Who wrote each line?</code></pre>
      <p>Git fluency is one of those skills that feels unnecessary until you're working in a team — and then it becomes essential every single day. Start practicing the branch workflow on your personal projects now so it's second nature by the time it counts.</p>
    `

    content: `
      <p>Big-O notation shows up in every technical interview, every algorithms course, and every serious discussion about code quality. But most students memorize the definitions without understanding what they're actually measuring — which means they can't apply it when it matters.</p>
      <p>Here's a complete, intuitive breakdown of Big-O that will make algorithm questions feel much less abstract.</p>
      <h2>What Big-O actually measures</h2>
      <p>Big-O describes how the runtime (or memory usage) of an algorithm grows as the input size grows. It's not about how fast your code runs on your laptop. It's about the shape of the growth curve.</p>
      <p>Imagine you're searching for a name in a phonebook. If the phonebook has 1,000 names vs 1,000,000 names, how much longer does your search take? That ratio — how runtime scales with input — is what Big-O captures.</p>
      <h2>The most common complexities</h2>
      <p><strong>O(1) — Constant time.</strong> Runtime doesn't depend on input size at all. Accessing an array element by index, checking a HashMap — these are O(1). No matter if you have 10 elements or 10 million, the operation takes the same time.</p>
      <pre><code>int first = arr[0];  // Always one operation, regardless of arr.length</code></pre>
      <p><strong>O(log n) — Logarithmic.</strong> Runtime grows slowly as input grows. Binary search is the classic example — each step eliminates half the remaining possibilities. Doubling the input only adds one more step.</p>
      <pre><code>// Binary search — O(log n)
int low = 0, high = arr.length - 1;
while (low &lt;= high) {
    int mid = (low + high) / 2;
    if (arr[mid] == target) return mid;
    else if (arr[mid] &lt; target) low = mid + 1;
    else high = mid - 1;
}</code></pre>
      <p><strong>O(n) — Linear.</strong> Runtime grows proportionally with input size. A single loop over an array is O(n). If you double the input, you double the time.</p>
      <p><strong>O(n log n) — Linearithmic.</strong> This is the complexity of efficient sorting algorithms — Merge Sort, Quick Sort (average case), Heap Sort. Better than O(n²), which is why these replaced bubble sort for large datasets.</p>
      <p><strong>O(n²) — Quadratic.</strong> A nested loop where both loops iterate over the input. Bubble sort, insertion sort. For 1,000 elements: 1,000,000 operations. For 10,000 elements: 100,000,000 operations. This is why O(n²) becomes painfully slow at scale.</p>
      <pre><code>// O(n²) — two nested loops over the same array
for (int i = 0; i &lt; n; i++) {
    for (int j = 0; j &lt; n; j++) {
        // This inner block runs n² times total
    }
}</code></pre>
      <h2>How to analyze your own code</h2>
      <p>Count loops. One loop = O(n). Nested loops = multiply: two nested loops over n = O(n²). Loops that halve the remaining work each iteration = O(log n).</p>
      <p>Drop constants and lower-order terms. O(2n) is just O(n). O(n² + n) is just O(n²). Big-O describes growth rate, and constants don't change the shape of that curve at scale.</p>
      <p>Look for hidden loops. String concatenation in a loop is O(n²) in languages that create new string objects (like Java's <code>+</code> operator). Using StringBuilder instead makes it O(n). HashMap lookups inside a loop look like O(n) outer loop × O(1) lookup = O(n) total.</p>
      <h2>Space complexity matters too</h2>
      <p>Big-O applies to memory as well. A recursive function that calls itself n times deep uses O(n) stack space. Creating a new array of size n uses O(n) space. In-place sorting algorithms like Heap Sort use O(1) space — a real advantage in memory-constrained environments.</p>
      <p>When interviewers ask about complexity, always address both time and space. "This solution is O(n) time and O(1) space" signals a deeper understanding than just the runtime.</p>
    `

      <p>IT Study Hub started as a submission for our End Semester Development (ESD) project at Techno India University. Four B.Sc IT students, one semester, and a goal: build something that would actually help the students who came after us.</p>
      <p>This is the behind-the-scenes story of how we built it — the architecture decisions, the things that broke, and what we learned.</p>
      <h2>The problem we were solving</h2>
      <p>TIU's IT curriculum covers C, Java, Python, C++, and web technologies. Good courses — but the learning materials were scattered. Notes were on WhatsApp. Video explanations were on random YouTube channels. Practice questions were photocopied from textbooks. There was no single place where a student could go from "I don't understand this concept" to "I've practiced it and tested myself."</p>
      <p>We wanted to build that place.</p>
      <h2>The tech stack we chose — and why</h2>
      <p><strong>Frontend: Pure HTML, CSS, JavaScript.</strong> No React, no Next.js. This was a deliberate choice. We wanted the site to be fast, deployable on GitHub Pages without a build step, and understandable by all four of us regardless of framework experience. Every page is a plain HTML file. The complexity comes from JavaScript modules, not framework abstractions.</p>
      <p><strong>Backend: Firebase.</strong> Firebase Authentication handles login (magic links — no passwords to manage). Firestore stores user data, XP, quiz scores, and course progress. Firebase Storage handles profile photo uploads. We get a real-time database, authentication, and file storage without managing any servers.</p>
      <p><strong>Payments: Razorpay.</strong> For our premium tier. Razorpay's test mode made development easy, and the webhook system updates user plan status in Firestore automatically after payment.</p>
      <p><strong>Hosting: GitHub Pages.</strong> Free, fast, and deploys on every git push. For a static site, it's the obvious choice.</p>
      <h2>The drag-to-login system</h2>
      <p>Our favorite feature — and the one that took the longest to get right. Instead of a standard "click to submit" login button, we built a drag slider that users slide across to trigger the login. It's a CAPTCHA-style interaction that prevents bot submissions while feeling genuinely satisfying to use.</p>
      <p>Under the hood, it's a custom CSS track + thumb element with mouse/touch event listeners tracking the drag distance. When the thumb reaches the right end, it triggers the Firebase auth flow. We integrated Cloudflare Turnstile as an additional bot-protection layer before the actual magic link email gets sent.</p>
      <h2>The XP system</h2>
      <p>We built a gamified XP engine (<code>xp-engine.js</code>) that awards points for completing quiz questions, passing code challenges, and finishing course modules. XP is stored in Firestore and feeds into a global leaderboard. The key design constraint: XP actions are idempotent — the same action key can only award XP once per user, enforced both client-side (localStorage cache) and server-side (Firestore earnedXPKeys array).</p>
      <h2>What broke (and how we fixed it)</h2>
      <p><strong>The cursor on mobile.</strong> We built a custom cursor with a lime dot that follows the mouse. On touchscreens, there's no mouse — but the cursor JS was still running, consuming CPU with an empty animation loop. Fix: <code>window.matchMedia('(pointer: fine)').matches</code> to detect pointer devices before initializing the cursor.</p>
      <p><strong>Firestore security rules.</strong> Our initial rules were too permissive — any authenticated user could read any other user's data. We tightened the rules so users can only read and write their own documents: <code>allow read, write: if request.auth.uid == userId;</code></p>
      <p><strong>The premium modal on paid users.</strong> Paid users were still seeing "Unlock Premium" buttons throughout the site. We built <code>checkAndHidePremiumCTAs()</code> in <code>premium-modal.js</code> — it runs on every page load, checks Firestore for the user's plan, and replaces all upgrade buttons with an "Active" badge.</p>
      <h2>What we'd do differently</h2>
      <p>We'd use a proper component system from the start. Our nav HTML is copy-pasted across 20+ files — a change to the nav means editing every file. A simple HTML include system or web components would have saved hours of work.</p>
      <p>We'd also write the CSS architecture first. Our stylesheets grew organically and ended up with duplicate rules across global.css, pages.css, and inline styles. A CSS custom property system and a clear specificity hierarchy from day one would have kept things cleaner.</p>
      <p>But the things we got right — Firebase's real-time database, the XP system, the practice IDE with Judge0 code execution, the Razorpay integration — those worked better than we expected. Shipping something real, with real users and real payments, taught us more than any tutorial ever could.</p>
      <p>The site is live at itstudyhub.dpdns.org. If you're a TIU student reading this — it was built for you.</p>
    `

      <p>Object-Oriented Programming is the foundation of Java and most modern software development. TIU's Java syllabus centers on four pillars: Encapsulation, Inheritance, Polymorphism, and Abstraction. Here's each one explained from scratch with real code examples.</p>
      <h2>Classes and Objects — the building blocks</h2>
      <p>A class is a blueprint. An object is an instance built from that blueprint.</p>
      <pre><code>class Student {
    // Fields (attributes)
    String name;
    int rollNo;
    double gpa;

    // Constructor — called when you create an object
    Student(String name, int rollNo, double gpa) {
        this.name = name;
        this.rollNo = rollNo;
        this.gpa = gpa;
    }

    // Method (behaviour)
    void displayInfo() {
        System.out.println(name + " | Roll: " + rollNo + " | GPA: " + gpa);
    }
}

// Creating objects
Student s1 = new Student("Dithsa", 101, 9.2);
Student s2 = new Student("Mithila", 102, 8.8);
s1.displayInfo();  // Dithsa | Roll: 101 | GPA: 9.2</code></pre>
      <h2>Pillar 1: Encapsulation</h2>
      <p>Encapsulation means hiding internal data behind controlled access. Use <code>private</code> fields and <code>public</code> getters/setters:</p>
      <pre><code>class BankAccount {
    private double balance;  // Can't be accessed directly

    public double getBalance() {
        return balance;
    }

    public void deposit(double amount) {
        if (amount > 0) balance += amount;  // Controlled modification
    }
}</code></pre>
      <p>Why? You control how data changes. No external code can set balance to -5000 accidentally.</p>
      <h2>Pillar 2: Inheritance</h2>
      <p>A child class inherits fields and methods from a parent class using <code>extends</code>:</p>
      <pre><code>class Animal {
    String name;
    void eat() { System.out.println(name + " is eating"); }
}

class Dog extends Animal {
    void bark() { System.out.println(name + " says: Woof!"); }
}

Dog d = new Dog();
d.name = "Bruno";
d.eat();   // Inherited from Animal
d.bark();  // Dog's own method</code></pre>
      <p><strong>super</strong> keyword calls the parent class constructor or method. Use it when the child needs to initialize the parent's fields.</p>
      <h2>Pillar 3: Polymorphism</h2>
      <p>One interface, many behaviors. Two types:</p>
      <p><strong>Method Overloading</strong> (compile-time) — same method name, different parameters:</p>
      <pre><code>class Calculator {
    int add(int a, int b) { return a + b; }
    double add(double a, double b) { return a + b; }
    int add(int a, int b, int c) { return a + b + c; }
}</code></pre>
      <p><strong>Method Overriding</strong> (runtime) — child redefines a parent's method:</p>
      <pre><code>class Shape {
    double area() { return 0; }
}

class Circle extends Shape {
    double radius;
    Circle(double r) { radius = r; }

    @Override
    double area() { return Math.PI * radius * radius; }
}

class Rectangle extends Shape {
    double width, height;
    Rectangle(double w, double h) { width = w; height = h; }

    @Override
    double area() { return width * height; }
}

// Polymorphic usage
Shape s = new Circle(5);
System.out.println(s.area());  // 78.53... — Circle's area() runs</code></pre>
      <h2>Pillar 4: Abstraction</h2>
      <p>Hiding implementation details, showing only what's necessary. Two mechanisms: abstract classes and interfaces.</p>
      <pre><code>// Abstract class — can have both abstract and concrete methods
abstract class Vehicle {
    abstract void start();  // Must be implemented by subclass
    void stop() { System.out.println("Vehicle stopped"); }  // Shared
}

// Interface — pure contract, all methods abstract (before Java 8)
interface Flyable {
    void fly();
    void land();
}</code></pre>
      <p>Key difference: a class can <code>implements</code> multiple interfaces but can only <code>extends</code> one abstract class. In exams, if asked "how does Java achieve multiple inheritance?" — the answer is interfaces.</p>
      <h2>The exam questions to master</h2>
      <p>Write a program to demonstrate runtime polymorphism using method overriding. Create an abstract class Shape with subclasses Circle, Rectangle, Triangle. Implement an interface Drawable with multiple classes. Show constructor chaining using super(). These four scenarios cover 80% of TIU Java exam questions on OOP.</p>
    `

      <p>Data Structures is one of the most important subjects in the TIU B.Sc IT curriculum — and one of the most heavily tested in both semester exams and placement interviews. This guide covers every structure you need to know, with implementations in both C and Java.</p>
      <h2>Arrays — the foundation</h2>
      <p>An array stores elements of the same type in contiguous memory locations. Access by index is O(1). Insertion/deletion in the middle is O(n) because elements must shift.</p>
      <pre><code>// C
int arr[5] = {10, 20, 30, 40, 50};
printf("%d\n", arr[2]);  // 30

// Java
int[] arr = {10, 20, 30, 40, 50};
System.out.println(arr[2]);  // 30</code></pre>
      <h2>Linked Lists</h2>
      <p>A linked list stores elements as nodes, each containing data and a pointer to the next node. No contiguous memory required. Insertion/deletion is O(1) if you have the node. Access is O(n).</p>
      <pre><code>// C — Node structure
struct Node {
    int data;
    struct Node *next;
};

// Insert at beginning
void insertFront(struct Node **head, int data) {
    struct Node *newNode = malloc(sizeof(struct Node));
    newNode->data = data;
    newNode->next = *head;
    *head = newNode;
}</code></pre>
      <p><strong>Types to know:</strong> Singly linked list (next pointer only), Doubly linked list (next and prev pointers), Circular linked list (last node points back to first).</p>
      <h2>Stacks — LIFO</h2>
      <p>Last In, First Out. Think of a stack of plates. Operations: push (add to top), pop (remove from top), peek (view top without removing).</p>
      <pre><code>// Java — Stack using ArrayList
class Stack {
    private ArrayList&lt;Integer&gt; items = new ArrayList&lt;&gt;();

    void push(int item) { items.add(item); }

    int pop() {
        if (isEmpty()) throw new RuntimeException("Stack is empty");
        return items.remove(items.size() - 1);
    }

    int peek() { return items.get(items.size() - 1); }

    boolean isEmpty() { return items.isEmpty(); }
}</code></pre>
      <p><strong>Applications:</strong> Function call management (call stack), expression evaluation, undo/redo, balanced parentheses checking.</p>
      <h2>Queues — FIFO</h2>
      <p>First In, First Out. Think of a queue at a ticket counter. Operations: enqueue (add to rear), dequeue (remove from front).</p>
      <pre><code>// Circular Queue in C — avoids wasted space
#define MAX 5
int queue[MAX], front = -1, rear = -1;

void enqueue(int item) {
    if ((rear + 1) % MAX == front) { printf("Full\n"); return; }
    if (front == -1) front = 0;
    rear = (rear + 1) % MAX;
    queue[rear] = item;
}

int dequeue() {
    if (front == -1) { printf("Empty\n"); return -1; }
    int item = queue[front];
    if (front == rear) front = rear = -1;
    else front = (front + 1) % MAX;
    return item;
}</code></pre>
      <h2>Trees</h2>
      <p>A tree is a hierarchical data structure. The Binary Search Tree (BST) is the most exam-relevant: left child < parent < right child. Search, insert, delete are all O(log n) for balanced trees.</p>
      <pre><code>// BST Node in Java
class Node {
    int data;
    Node left, right;
    Node(int data) { this.data = data; }
}

class BST {
    Node root;

    Node insert(Node root, int data) {
        if (root == null) return new Node(data);
        if (data < root.data) root.left = insert(root.left, data);
        else if (data > root.data) root.right = insert(root.right, data);
        return root;
    }

    // Inorder traversal — gives sorted output for BST
    void inorder(Node root) {
        if (root == null) return;
        inorder(root.left);
        System.out.print(root.data + " ");
        inorder(root.right);
    }
}</code></pre>
      <p><strong>Tree traversals to memorize:</strong> Inorder (Left-Root-Right), Preorder (Root-Left-Right), Postorder (Left-Right-Root). For BST, inorder gives sorted output — a common exam question.</p>
      <h2>Sorting algorithms — complexity comparison</h2>
      <p><strong>Bubble Sort:</strong> O(n²) — compare adjacent elements, swap if out of order. Simple but slow. Know it for exams.</p>
      <p><strong>Selection Sort:</strong> O(n²) — find minimum in unsorted portion, swap to front.</p>
      <p><strong>Insertion Sort:</strong> O(n²) average, O(n) best case — efficient for nearly sorted arrays.</p>
      <p><strong>Merge Sort:</strong> O(n log n) — divide and conquer. Stable sort. Extra space needed.</p>
      <p><strong>Quick Sort:</strong> O(n log n) average, O(n²) worst — in-place, fast in practice.</p>
      <h2>The exam strategy</h2>
      <p>TIU data structures exams almost always include: trace a sorting algorithm step by step, draw a BST after insertions, implement a stack or queue, write a linked list insertion/deletion. Master these four question types and you're covered for 80% of the exam.</p>
    `
  }

      <p>Getting your first internship as a TIU student feels impossible when every listing says "1-2 years experience required." But thousands of students from Indian colleges land internships every semester — without connections, without a 10 CGPA, and without knowing anyone at the company. Here's exactly how.</p>
      <h2>The timeline that actually works</h2>
      <p>Start 3 months before you want to intern. One month to build your portfolio and resume. One month to apply and follow up. One month buffer for interview rounds and offers. Most students start two weeks before they want to start — that's too late.</p>

      <p><strong>A one-page resume.</strong> One page only. Include: education (TIU, branch, CGPA if above 7.5), skills (languages and tools you actually know), projects (2-3 with tech stack and a GitHub link), any certifications. No objective statements. No references. No photos.</p>

      <p>For web internships: HTML/CSS/JavaScript + one framework (React preferred). For backend: Python/Java + basic SQL + REST API understanding. For data: Python + pandas + basic ML (scikit-learn). For mobile: Flutter or React Native basics.</p>

      <h2>The interview process at Indian companies</h2>
      <p><strong>Aptitude round</strong> — logical reasoning, quantitative aptitude, basic coding. Prepare with previous TCS/Infosys aptitude papers. Platforms: PrepInsta, IndiaBix.</p>
      <p><strong>Technical round</strong> — HR or technical interviewer. Questions about your resume, your projects, basic CS concepts (OOP, DBMS basics, OS basics), and 1-2 coding problems. Know your projects inside out — they will ask about implementation details.</p>
      <p><strong>HR round</strong> — "Tell me about yourself" (prepare a 90-second answer), "Why this company?", "Where do you see yourself in 5 years?", "What's your biggest weakness?" These are not trick questions. They want to know if you're articulate and genuine.</p>

    `

    title: 'How a Program Actually Works: From Code to Output',
    excerpt: 'Have you ever wondered what really happens after you click "Run"? A program goes through several fascinating stages before producing any output.',
    category: 'tutorial',
    catLabel: 'Tutorial',
    author: 'Dithsa Dutta',
    authorRole: 'Founder & Lead Architect',
    date: 'Jun 22, 2026',
    readTime: '7 min',
    featured: false,
    tags: ['Computer Science', 'Programming Basics', 'How It Works'],
    content: `
      <p>Have you ever wondered what really happens after you click "Run"? Most beginners see code as a magic incantation — type the right words, get an output. But understanding the actual journey from source code to output transforms how you think about programming.</p>
      <h2>Stage 1: Source Code</h2>
      <p>Your source code is plain text. A <code>.c</code> file, a <code>.java</code> file, a <code>.py</code> file — these are text files the computer cannot directly execute. Before anything runs, your code must be transformed.</p>
      <h2>Stage 2: Compilation or Interpretation</h2>
      <p><strong>Compiled languages (C, C++, Rust):</strong> A compiler reads your entire source file and translates it into machine code — binary instructions your CPU can execute directly. This translation happens once, before the program runs.</p>
      <p><strong>Interpreted languages (Python, JavaScript):</strong> An interpreter reads and executes your code line by line at runtime. There's no separate compilation step — this is why Python is slower than C but faster to iterate with.</p>
      <p><strong>Hybrid (Java):</strong> The Java compiler translates source code to bytecode — an intermediate format. The JVM then interprets or JIT-compiles this bytecode at runtime. This is how Java achieves "write once, run anywhere."</p>
      <h2>Stage 3: Memory Allocation</h2>
      <p>When your program starts, the OS allocates memory divided into regions: the stack (function calls and local variables), the heap (dynamic allocation — <code>malloc</code> in C, <code>new</code> in Java), and the code segment (compiled instructions). Variables are stored at specific memory addresses — the variable name is just a human-readable label for that address.</p>
      <h2>Stage 4: CPU Execution</h2>
      <p>The CPU executes a fetch-decode-execute cycle — fetch an instruction from memory, decode what it means, execute it, move to the next. This happens billions of times per second. The OS manages scheduling, I/O, and memory protection between processes.</p>
      <h2>Why this matters</h2>
      <p>Understanding this journey makes programming much easier because you begin to see what is happening behind your code — not just what appears on the screen. When you get a segmentation fault, you know it means your program tried to access memory it doesn't own. When your program is slow, you can reason about whether it's CPU-bound or I/O-bound. The computer isn't magic. It's a very fast, very literal machine — and the closer your mental model matches that reality, the better programmer you become.</p>
    `
  }

    excerpt: 'Data structures are the foundation behind efficient software. Choosing the right one can make a program dramatically faster and easier to maintain.',
    category: 'tutorial',

    content: `
      <p>Data structures are the foundation behind efficient software. Arrays, linked lists, stacks, queues, trees, and hash tables provide different ways to organize and access information. Choosing the right structure can make a program faster, simpler, and easier to maintain.</p>
      <p>Even if you're a beginner, learning the basic idea behind data structures early can dramatically improve your problem-solving skills. Instead of asking only "How do I write this code?", you start asking a more important question: "What is the best way to organize and process this data?"</p>
      <h2>The core structures every programmer must know</h2>
      <p><strong>Arrays</strong> — Elements stored in contiguous memory, accessed by index in O(1). Best for fast random access when size is known. Weakness: inserting or deleting in the middle is O(n).</p>
      <p><strong>Linked Lists</strong> — Each node holds data and a pointer to the next node. Inserting at the front is O(1). Weakness: no random access — finding the nth element requires traversing from the beginning.</p>
      <p><strong>Stacks</strong> — Last In, First Out (LIFO). Used for function call management, undo operations, and expression evaluation.</p>
      <p><strong>Queues</strong> — First In, First Out (FIFO). Used for task scheduling, BFS graph traversal, and message queues in distributed systems.</p>
      <p><strong>Hash Tables</strong> — O(1) average lookup by key. This is how Java's HashMap and Python's dict work internally — a hash function maps keys to array indices, making retrieval nearly instant regardless of size.</p>
      <p><strong>Trees</strong> — Hierarchical structures. Binary Search Trees give O(log n) search. File systems, databases, and the HTML DOM are all trees.</p>
      <h2>A practical example</h2>
      <p>Suppose you're building a feature that checks whether a username is already taken. Option A: store usernames in an array and loop through every time — O(n) per check, slow for large user bases. Option B: store them in a HashSet — O(1) per check, regardless of how many users you have.</p>
      <p>Same problem, same data, dramatically different performance. That's the power of choosing the right structure.</p>
      <h2>How to practice</h2>
      <p>Don't just read about data structures — implement them from scratch. Write a linked list in C. Build a stack in Java. Implement a basic hash table in Python. LeetCode's data structures track and IT Study Hub's practice section both offer progressive challenges. Start with arrays, then linked lists, then move to trees and graphs. Every algorithm you encounter builds on these foundations.</p>
    `

    excerpt: 'Typing a URL and pressing Enter seems simple — but a lot happens in milliseconds. Here\'s the hidden journey behind every website you visit.',
    category: 'tutorial',

    author: 'Argha Paul',

    tags: ['Web Dev', 'Networking', 'DNS', 'HTTP', 'How It Works'],
    content: `
      <p>Typing a website address and pressing Enter seems simple, but a lot happens in milliseconds. Every time you open a webpage, your browser, your OS, multiple servers, and thousands of kilometers of fiber-optic cable coordinate to deliver a response. Here's the hidden journey behind every website you visit.</p>
      <h2>Step 1: DNS Resolution</h2>
      <p>Your browser doesn't know where <code>itstudyhub.dpdns.org</code> is — it only understands IP addresses like <code>185.199.108.153</code>. So the first step is asking the Domain Name System (DNS) to translate the domain name into an IP address.</p>
      <p>Your computer checks its local DNS cache first. If not cached, it asks your ISP's DNS server. If that doesn't know, the query travels up the DNS hierarchy — to root servers, then top-level domain servers (.org, .com), then the authoritative nameserver for that domain. The whole chain typically resolves in under 100 milliseconds.</p>
      <h2>Step 2: TCP Connection &amp; TLS Handshake</h2>
      <p>With the IP address in hand, your browser opens a TCP connection via a three-way handshake: SYN → SYN-ACK → ACK. This establishes a reliable connection before any data transfers. For HTTPS sites, a TLS handshake follows — your browser and server agree on encryption and exchange cryptographic keys. This is what makes the padlock icon appear.</p>
      <h2>Step 3: HTTP Request</h2>
      <p>Your browser sends an HTTP request to the server — essentially: "Give me the main page, here's what content types I can handle, here's my browser info." The server reads this and decides what to send back.</p>
      <h2>Step 4: Server Processing</h2>
      <p>For a static site (like IT Study Hub on GitHub Pages), the server simply finds the HTML file and sends it. For a dynamic site — a social feed, an e-commerce store — the server runs application code, queries a database for personalized data, constructs an HTML response, and sends it. This is the layer where backend programming, APIs, and databases live.</p>
      <h2>Step 5: Browser Rendering</h2>
      <p>Your browser receives HTML and parses it top to bottom. CSS file links trigger new HTTP requests. Script tags fetch and execute JavaScript. Images trigger their own requests. The browser builds a DOM from the HTML and a CSSOM from the stylesheets — these combine into the Render Tree. The browser then calculates layout (where each element goes) and paints pixels to the screen.</p>
      <h2>Why this matters for developers</h2>
      <p>Understanding this process gives beginners a foundation for learning web development, APIs, backend programming, databases, and full-stack development. DNS explains why changing a domain takes time to propagate. TCP explains why network latency affects page load. The HTTP cycle is the foundation of every API you'll ever build. The rendering pipeline explains why too many scripts block your page.</p>
      <p>Every web developer works within this system every day. The ones who understand it deeply can debug faster, optimize better, and build systems that work reliably at scale.</p>
    `

  15: `<svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="rgba(167,139,250,0.55)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 1 7 7c0 2.62-1.44 4.9-3.56 6.14L15 17H9l.56-1.86A7 7 0 0 1 5 9a7 7 0 0 1 7-7Z"/><path d="M9 21h6"/><path d="M7.5 6l1.5 1.5L12 5l3 2.5 1.5-1.5"/></svg>`,
  16: `<svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="rgba(96,165,250,0.55)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M9 9l1.5 1.5L13 8l2 2"/></svg>`,
  17: `<svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="rgba(67,233,123,0.55)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`,
  18: `<svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="rgba(200,241,53,0.55)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
  default: `<svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="rgba(200,241,53,0.45)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>`,
};

// ── Per-author avatars ──
const AUTHOR_ART = {
  'Dithsa Dutta':      `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(200,241,53,0.9)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>`,
  'Mithila Rani Saha': `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(232,180,255,0.9)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>`,
  'Snehanshu Sarkar':  `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(96,165,250,0.9)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>`,
  'Argha Paul':        `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(167,139,250,0.9)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>`,
  'IT Study Hub':      `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(247,183,49,0.9)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>`,
  default:             `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(200,241,53,0.7)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>`,
};

// ── Get post ID from URL ──
const params = new URLSearchParams(window.location.search);
const postId = parseInt(params.get('id'));
const post = POSTS.find(p => p.id === postId);

// ── Render ──
const root = document.getElementById('appRoot');

if (!post) {
  root.innerHTML = `
    <div class="not-found">
      <div class="nf-icon" aria-hidden="true"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h9"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/><path d="M16 19h6M19 16v6"/></svg></div>
      <h1 class="nf-title">Article Not Found</h1>
      <p class="nf-sub">This article doesn't exist or may have been moved.</p>
      <a href="blog.html" class="btn-lime">← Back to Blog</a>
    </div>`;
} else {
  document.title = `${post.title} — IT Study Hub`;

  // Related posts — 2 random others
  const related = POSTS.filter(p => p.id !== post.id).sort(() => Math.random()-0.5).slice(0,2);

  // Extract headings for TOC
  const headings = [...post.content.matchAll(/<h2>(.*?)<\/h2>/g)].map((m,i) => ({
    text: m[1].replace(/<[^>]*>/g,''),
    index: i
  }));

  const tocHTML = headings.length ? headings.map((h,i) => `
    <a class="toc-item" id="toc-${i}" href="#heading-${i}">
      <span class="toc-num">0${i+1}</span>
      <span>${h.text}</span>
    </a>`).join('') : '<p style="font-size:12px;color:var(--muted)">No sections</p>';

  // Number the headings in content
  let hIdx = 0;
  const numberedContent = post.content.replace(/<h2>/g, () => `<h2 id="heading-${hIdx++}">`);

  root.innerHTML = `
  <div class="layout post-layout">
    <article class="article-wrap">
      <div class="article-hero">
        <div class="art-category">${post.catLabel}</div>
        <h1 class="art-title">${post.title}</h1>
        <p class="art-excerpt">${post.excerpt}</p>
        <div class="art-meta">
          <div class="meta-author">
            <div class="meta-avatar" aria-hidden="true">${AUTHOR_ART[post.author] || AUTHOR_ART.default}</div>
            <div>
              <div class="meta-name">${post.author}</div>
              <div class="meta-role">${post.authorRole || ''}</div>
            </div>
          </div>
          <div class="meta-divider"></div>
          <div class="meta-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${post.date}</div>
          <div class="meta-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${post.readTime} read</div>
        </div>
      </div>

      <div class="art-visual">
        <div class="art-visual-grid"></div>
        <div style="position:relative;z-index:1;" aria-hidden="true">${POST_ART[post.id] || POST_ART.default}</div>
      </div>

      <div class="art-body post-body">${numberedContent}</div>

      <div class="art-footer">
        <div class="art-tags">
          ${(post.tags || []).map(t => `<span class="art-tag"># ${t}</span>`).join('')}
        </div>
        <div class="related-title">More Articles</div>
        <div class="related-grid">
          ${related.map(r => `
            <a class="related-card" href="blog-post.html?id=${r.id}">
              <div class="rc-icon" aria-hidden="true">${POST_ART[r.id] || POST_ART.default}</div>
              <div class="rc-cat">${r.catLabel}</div>
              <div class="rc-title">${r.title}</div>
              <div class="rc-meta">${r.readTime} read · ${r.author}</div>
            </a>`).join('')}
        </div>
      </div>
    </article>

    <aside class="sidebar post-sidebar">
      <div class="sidebar-card">
        <span class="sc-label">Reading Progress</span>
        <div class="progress-widget">
          <svg class="prog-circle" viewBox="0 0 72 72" style="width:72px;height:72px;margin:16px auto;display:block;">
            <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>
            <circle id="progCircle" cx="36" cy="36" r="30" fill="none" stroke="#c8f135" stroke-width="4"
              stroke-dasharray="188.5" stroke-dashoffset="188.5" stroke-linecap="round"
              transform="rotate(-90 36 36)" style="transition:stroke-dashoffset 0.1s"/>
          </svg>
          <div class="prog-text" id="progPct" style="font-family:var(--ff-display);font-size:24px;font-weight:800;color:var(--lime);text-align:center;">0%</div>
          <div class="prog-sub" style="font-family:var(--ff-mono);font-size:10px;color:var(--muted);text-align:center;letter-spacing:1px;text-transform:uppercase;margin-top:4px;">${post.readTime} read</div>
        </div>
      </div>

      ${headings.length ? `
      <div class="sidebar-card">
        <span class="sc-label">In This Article</span>
        ${tocHTML}
      </div>` : ''}

      <div class="sidebar-card">
        <span class="sc-label">Share</span>
        <button class="share-btn copy-btn" onclick="copyLink()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Copy Link</button>
        <button class="share-btn" onclick="shareTwitter()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.7 5.3 4.3 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg> Share on X</button>
        <button class="share-btn" onclick="shareLinkedIn()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg> Share on LinkedIn</button>
      </div>

      <div class="sidebar-card" style="background:var(--lime-dim);border-color:var(--border-active);">
        <span class="sc-label" style="color:var(--lime)">Enjoyed this?</span>
        <p style="font-size:13px;color:var(--muted2);line-height:1.6;margin-bottom:14px;">Unlock advanced lessons and all 6 courses with Premium access.</p>
        <a href="premium.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:var(--lime);color:#000;text-align:center;padding:10px;border-radius:8px;font-family:var(--ff-mono);font-size:11px;font-weight:700;text-decoration:none;letter-spacing:1px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.09 12.26A1 1 0 0 0 5 14h6l-2 8 8.91-10.26A1 1 0 0 0 17 10h-6l2-8Z"/></svg> GO PREMIUM</a>
      </div>
    </aside>
  </div>`;

  // ── Reading progress ──
  function updateProgress() {
    const winScroll = document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const pct = height > 0 ? Math.round((winScroll / height) * 100) : 0;
    document.getElementById('readProgress').style.width = pct + '%';
    const el = document.getElementById('progPct');
    const circle = document.getElementById('progCircle');
    if (el) el.textContent = pct + '%';
    if (circle) circle.style.strokeDashoffset = 188.5 - (188.5 * pct / 100);

    // Highlight active TOC item
    const headingEls = document.querySelectorAll('[id^="heading-"]');
    let current = 0;
    headingEls.forEach((el, i) => {
      if (el.getBoundingClientRect().top < 160) current = i;
    });
    document.querySelectorAll('.toc-item').forEach((el,i) => {
      el.classList.toggle('active', i === current);
    });
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
}

// ── Share functions ──
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    showToast('🔗', 'Link copied to clipboard!');
  });
}
function shareTwitter() {
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent((post?.title || '') + ' — IT Study Hub')}&url=${encodeURIComponent(window.location.href)}`;
  window.open(url, '_blank');
}
function shareLinkedIn() {
  const url = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.href)}`;
  window.open(url, '_blank');
}
const _TSVG = {
  '🔗': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c8f135" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  '✅': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c8f135" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
};
function showToast(icon, msg) {
  document.getElementById('toastIcon').innerHTML = _TSVG[icon] || _TSVG['✅'];
  document.getElementById('toastMsg').textContent = msg;
  const t = document.getElementById('toast');
  t.style.transform='translateY(0)'; t.style.opacity='1';
  setTimeout(() => { t.style.transform='translateY(80px)'; t.style.opacity='0'; }, 3000);
}

// ── Cursor ──
const cur = document.getElementById('cur');
const curR = document.getElementById('curR');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => {
  mx=e.clientX; my=e.clientY;
  cur.style.opacity='1'; curR.style.opacity='0.5';
});
(function anim() {
  cur.style.left=(mx-5)+'px'; cur.style.top=(my-5)+'px';
  rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
  curR.style.left=(rx-18)+'px'; curR.style.top=(ry-18)+'px';
  requestAnimationFrame(anim);
})();
document.addEventListener('mouseover', e => {
  if (e.target.matches('a,button,.related-card,.toc-item,.art-tag')) cur.style.transform='scale(2)';
  else cur.style.transform='scale(1)';
});
</script>
</body>
</html>
