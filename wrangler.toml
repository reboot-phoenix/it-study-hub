name = "it-study-hub"
main = "worker.js"
compatibility_date = "2026-08-27"

[assets]
directory = "."
binding = "ASSETS"
# Run the Worker for API calls. Without this, Cloudflare answers from static files only.
run_worker_first = ["/api/*"]

[vars]
# Public key id (safe to commit). Swap for rzp_live_... when you go live.
RAZORPAY_KEY_ID = "rzp_test_TCbxQ8kFJk4J53"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put RAZORPAY_KEY_SECRET
#   npx wrangler secret put RAZORPAY_WEBHOOK_SECRET
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT < service-account.json
