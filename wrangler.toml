name = "it-study-hub"
main = "worker.js"
compatibility_date = "2026-08-27"

[assets]
directory = "."
binding = "ASSETS"
# Run the Worker for API calls. Without this, Cloudflare answers from static files only.
run_worker_first = ["/api/*"]

[vars]
# Public key id (safe to commit). Swap for rzp_live_... when you go live.
RAZORPAY_KEY_ID = "rzp_test_TCbxQ8kFJk4J53"
# Code runner for the practice panel and the C terminal. The free public instance needs no key;
# for more headroom use a hosted Judge0 and `npx wrangler secret put JUDGE0_KEY` (RapidAPI key).
JUDGE0_URL = "https://ce.judge0.com"

# Email-code sign-in. EMAIL_FROM must be an address on a domain you have verified with your email service
# (Resend by default). Secrets, set with `npx wrangler secret put <NAME>`:
#   OTP_SECRET        any long random string (for example the output of: openssl rand -hex 32)
#   TURNSTILE_SECRET  the secret key of your Turnstile widget (Cloudflare dashboard > Turnstile)
#   MAIL_RELAY_URL / MAIL_RELAY_SECRET   from mail-relay.gs (Google Apps Script, sends from your Gmail; no domain needed)
#   (or RESEND_API_KEY + EMAIL_FROM, but Resend needs a domain you own)
EMAIL_FROM = "IT Study Hub <login@itstudyhub.dpdns.org>"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put RAZORPAY_KEY_SECRET
#   npx wrangler secret put RAZORPAY_WEBHOOK_SECRET
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT < service-account.json

# Premium lessons and PDFs live in Cloudflare KV, not in the public site.
# 1) npx wrangler kv namespace create PREMIUM      (prints an id)
# 2) paste the id below and remove the leading "# "
# 3) npx wrangler kv bulk put premium-export/kv-bulk.json --binding PREMIUM --remote
# [[kv_namespaces]]
# binding = "PREMIUM"
# id = "PASTE_ID_HERE"

# Optional: Cloudflare's own rate limiter for /api/run (otherwise the Worker uses a simple built-in one).
# [[unsafe.bindings]]
# name = "RUN_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }
