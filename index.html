<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Study Hub — Coming Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo { font-size: 1.2rem; font-weight: 600; color: #888; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 2rem; }
    h1 { font-size: 3.5rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
    p { font-size: 1.2rem; color: #aaa; max-width: 400px; line-height: 1.6; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #667eea; margin: 2.5rem auto 0; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
  </style>
</head>
<body>
  <div class="logo">IT Study Hub</div>
  <h1>Coming Soon</h1>
  <p>We're putting the finishing touches on something great. Check back soon!</p>
  <div class="dot"></div>
</body>
</html>
